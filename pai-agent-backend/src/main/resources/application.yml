server:
  port: 8080

spring:
  application:
    name: pai-agent-backend
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pai_agent;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.paiagent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# LLM Provider Configuration
llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com/v1
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
  glm:
    api-key: ${GLM_API_KEY:}
    base-url: https://open.bigmodel.cn/api/paas/v4

# Aliyun TTS Configuration
aliyun:
  tts:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    app-key: ${ALIYUN_TTS_APP_KEY:}
    region: cn-shanghai

# File Storage
storage:
  type: local
  local:
    path: ./uploads
    url-prefix: http://localhost:8080/files

# Logging
logging:
  level:
    com.paiagent: debug
    org.springframework.web: info
